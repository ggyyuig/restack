<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RE:STACK — Old cards. New connections.</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #20211d; overflow: hidden; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #root > div[data-composition-src] { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-duration="57.1">
    <div id="el-title" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="5" data-track-index="1"></div>
    <div id="el-product" data-composition-id="product" data-composition-src="compositions/product.html" data-start="5" data-duration="45.1" data-track-index="1"></div>
    <div id="el-closing" data-composition-id="closing" data-composition-src="compositions/closing.html" data-start="50.1" data-duration="7" data-track-index="1"></div>
    <audio id="narration" src="assets/audio/narration.wav" data-start="0" data-duration="57.1" data-track-index="2" data-volume="1"></audio>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
